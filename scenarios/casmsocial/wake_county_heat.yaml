scenario_name: wake_county_heat
model_name: casmsocial
description: Public Wake County Heat deployment fixture scenario.
parameters:
  model.name: casmsocial.citysim.citysocialmodel.CitySocialModel
  places.table: wake_county_heat.places
  households.table: wake_county_heat.hh_1000_households
  persons.table: wake_county_heat.persons_1000_households
  activities.table: wake_county_heat.activities_1000_households
  contacts.table: ''
  contacts.enabled: false
  communication.enabled: false
  # partition.table is auto-derived from places.table schema on multi-rank runs:
  #   partitions.wake_county_heat_place_partitions
  # Supports total_ranks = 2, 4, 8 (pre-generated via network_partitioner_ducklake.py).
  # Override partition.table explicitly to use a different partition table.
  partition.require_full_coverage: true
