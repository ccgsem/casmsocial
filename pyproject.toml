[tool.poetry]
name = "casmsocial"
version = "0.12.0"
description = "casmsocial is a Python framework for implementing agent-based models that simulate the dynamics of a synthetic population"
authors = ["Jon C Cline <jcline@mitre.org>", "Jon C Cline <jon.c.cline@gmail.com>"]
readme = "README.rst"
packages = [{include = "casmsocial"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
repast4py = "^1.1.4"
scipy = "^1.12.0"
gdal = "^3.8.3"
pyarrow = "^15.0.0"
python-dotenv = "^1.0.1"
pandas = "2.0.3"
pydantic = "^2.6.1"

[tool.poetry.scripts]
casmsocial = "casmsocial.cli:main"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
ruff = "^0.2.0"
pytest = "^8.0.0"
nox = "^2023.4.22"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
