model.name: 'casmsocial.heat_risk.optimized_heat_risk_model.OptimizedHeatRiskModel'
random.seed: 42
start.datetime: '2023-09-07 00:00:00'
duration.hours: 24
timezone: 'America/New_York'
time.step.minutes: 15
places.file: 'data/processed/wake_county_30/abm_inputs/places.parquet'
activities.file: 'data/processed/wake_county_30/abm_inputs/activities.parquet'
persons.file: 'data/processed/wake_county_30/abm_inputs/persons.parquet'
environment.file: 'data/processed/wake_county_30/abm_inputs/weather_at_places.parquet'
heat_threshold: 90
closest_cooling_center.file: 'data/processed/wake_county_30/abm_inputs/closest_cooling_center.parquet'
agent_log_file: 'data/processed/apache_flight/wake_county_30/output/agent_log.parquet'

# Parallel processing configuration - agent parallel processing disabled due to 
# 19% performance degradation (0.81x speedup) from thread overhead
parallel.agents.enabled: false
parallel.agents.min_threshold: 1000000
parallel.places.enabled: true
parallel.places.min_threshold: 50
parallel.places.auto_update: false
