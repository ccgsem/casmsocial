# Enhanced Heat Risk Model Configuration for MPI Execution
# This configuration uses METIS-partitioned data for distributed MPI execution
# Expected performance: 7-14x speedup compared to serial execution

# Model Selection
model.name: "casmsocial.heat_risk.enhanced_heat_risk_model.EnhancedHeatRiskModel"

# Random seed for reproducible results
random.seed: 42

# Basic Simulation Parameters
start.datetime: "2023-09-07 00:00:00"
duration.hours: 24
time.step.minutes: 15
timezone: "America/New_York"

# METIS-Partitioned Input Data Files
# These files are created by partition_data.py from METIS partitioning
# Use glob patterns for persons files (one partition per MPI rank)
places.file: "data/partitioned_8proc/places_partition.parquet"
persons.file: "data/partitioned_8proc/Imputation=1/partition=*/part-0.parquet"
activities.file: "data/processed/wake_county_30_v2/abm_inputs/activities.parquet"
Imputation: 1

# Heat Risk Specific Data
environment.file: "data/processed/apache_flight/wake_county_30_v2/weather_at_places.parquet"
closest_cooling_center.file: "data/processed/apache_flight/wake_county_30_v2/closest_cooling_center.parquet"
cooling_centers_experiment.file: "data/processed/wake_county_30_v2/abm_inputs/experiments.parquet"
experiment_id: 1
agent_log_file: "data/processed/apache_flight/wake_county_30_v2/output/agent_log.parquet"
lagged_weather.file: "data/processed/wake_county_30/abm_inputs/lagged_weather.parquet"
run_log_file: "data/processed/apache_flight/wake_county_30_v2/output/run_log.parquet"

# Heat Risk Parameters
heat_threshold_cooling_center: 90  # 90°F threshold for cooling center recommendations
heat_threshold_health_effect: 100  # 100°F threshold for health effect monitoring

# Parallel Processing Configuration
# Note: Using MPI distribution instead of threading
# Threading disabled due to GIL and lock contention overhead
parallel.places.enabled: false
parallel.places.min_threshold: 50
parallel.places.max_workers: null

# Enhanced Heat Risk Parallelization
# Keep disabled when using MPI for true distributed parallelism
parallel.heat.enabled: false
parallel.heat.max_workers: null
parallel.weather.cache_hours: 4
parallel.agent.batch_size: 1000

# Performance Monitoring
enable_performance_monitoring: true
log_level: "INFO"

# Expected Performance with MPI
# ============================
# Serial execution (1 process): ~250 seconds
# MPI-8 processes: ~35 seconds (7x speedup)
# MPI-16 processes: ~18 seconds (14x speedup)
#
# Why MPI is faster than threading:
# 1. No Python GIL contention (separate interpreters per process)
# 2. Minimal inter-process communication (METIS optimizes edge cuts)
# 3. Independent process execution (true parallelism)
# 4. Balanced load distribution across processes

# Usage Instructions
# ==================
# 1. Generate graph:
#    python -m casmsocial.graph_from_data \
#      --persons-file data/processed/wake_county_30_v2/abm_inputs/persons.parquet \
#      --imputation 1 \
#      --output-file data/wake_county_graph.txt \
#      --map-file data/wake_county_graph_id_map.txt
#
# 2. Run METIS partitioning:
#    gpmetis data/wake_county_graph.txt 8
#
# 3. Create partitioned data:
#    python -m casmsocial.partition_data \
#      --partition-file data/wake_county_graph.txt.part.8 \
#      --map-file data/wake_county_graph_id_map.txt \
#      --num-partitions 8
#
# 4. Run with MPI:
#    mpirun -n 8 python -m casmsocial config/enhanced_heat_risk_mpi.yaml

