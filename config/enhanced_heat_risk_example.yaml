# Enhanced Heat Risk Model Configuration for Wake County
# This configuration demonstrates how to use the parallelized heat risk model
# Expected performance improvement: 5-10x faster than original implementation (from ~1457s to ~200-300s)

# Model Selection
model.name: "casmsocial.heat_risk.enhanced_heat_risk_model.EnhancedHeatRiskModel"

# Random seed for reproducible results
random.seed: 42

# Basic Simulation Parameters (matching casmsocial_wc_30.yaml)
start.datetime: "2023-09-07 00:00:00"
duration.hours: 24
time.step.minutes: 15
timezone: "America/New_York"

# Input Data Files (Wake County paths relative to CASMSOCIAL_DATA_PATH)
places.table: "wake_county_heat.places"
persons.table: "wake_county_heat.persons"
activities.table: "wake_county_heat.activities"
Imputation: 1

# Heat Risk Specific Data (actual Wake County schema)
environment.table: "wake_county_heat.weather_at_places"
closest_cooling_center.table: "wake_county_heat.closest_cooling_center"
cooling_centers_experiment.table: "wake_county_heat.experiments_erl"
lagged_weather.table: "wake_county_heat.lagged_weather"
experiment_id: 1

# Output Files
agent_log_file: "data/processed/apache_flight/wake_county_30_v2/output_test2/agent_log.parquet"
agent_hourly_log_file: "data/processed/apache_flight/wake_county_30_v2/output_test2/agent_hourly_log.parquet"
run_log_file: "data/processed/apache_flight/wake_county_30_v2/output_test2/run_log.parquet"
run_person_log_file: "data/processed/apache_flight/wake_county_30_v2/output_test2/run_agent_log.parquet"
write_agent_tick_log: true
write_run_log: true
write_agent_hourly_log: true
write_end_run_person_log: true

# Heat Risk Parameters
distance_threshold_cooling_center: 2500 # 2500 meter threshold for distance to cooling center
cooling_center_operating_hours: true # if set to true, will consider cooling center operating hours
heat_threshold_cooling_center: 90  # 90°F threshold for cooling center recommendations
heat_threshold_health_effect: 100  # 100°F threshold for health effect monitoring
heat_threshold_work_break: 80 # 80°F threshold for recommended work breaks
degrees_f_minutes_threshold_cooling_center: 90
degrees_f_minutes_threshold_health_effect: 100
disable_heat_health_incidents: true

# Parallel Processing Configuration
# Note: Parallelization overhead exceeds benefits for this dataset size
# Testing showed 23x slowdown when enabled. Disabled by default.
parallel.places.enabled: false
parallel.places.min_threshold: 50
parallel.places.max_workers: null  # Use all available CPU cores

# Enhanced Heat Risk Parallelization
# Note: Keep disabled due to thread contention overhead
parallel.heat.enabled: false
parallel.heat.max_workers: null  # Use all available CPU cores
parallel.weather.cache_hours: 4
parallel.agent.batch_size: 1000

# Performance Monitoring
enable_performance_monitoring: true
log_level: "INFO"

# Expected Performance Improvements:
# - Original implementation: ~1457 seconds
# - Enhanced implementation: ~200-300 seconds
# - Expected speedup: 5-10x faster
# - Memory usage: Optimized through caching and vectorization
# - CPU utilization: Better multi-core utilization
