name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: mpicc
      CXX: mpicxx

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmetis-dev libopenmpi-dev openmpi-bin

      - name: Sync dependencies
        run: uv sync --locked --extra data-builder

      - name: Run quality checks
        run: make check

      - name: Run tests
        run: make test

      - name: Build and scan public release artifacts
        run: |
          uv build --clear
          uv run mkdocs build --strict
          uv run python scripts/verify_release_artifacts.py dist site

      - name: Generate and verify Python dependency SBOM
        run: |
          mkdir -p build/sbom
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment "$(uv python find)" \
            --pyproject pyproject.toml \
            --mc-type application \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file build/sbom/casmsocial-python.cdx.json
          uv run python scripts/verify_python_sbom.py \
            build/sbom/casmsocial-python.cdx.json \
            --policy casmsocial/datasets/colorado_front_range/assets/dependency_license_policy.yaml

      - name: Verify migrated-code provenance coverage
        run: |
          uv run python scripts/verify_migrated_code_provenance.py \
            --provenance casmsocial/datasets/colorado_front_range/assets/migrated_code_provenance.yaml \
            --license-manifest casmsocial/datasets/colorado_front_range/assets/source_licenses.yaml \
            --repository-root .

      - name: Verify release remains gated on explicit approvals
        run: uv run python scripts/verify_release_readiness.py --expect-status review_required

      - name: Upload Python dependency SBOM
        uses: actions/upload-artifact@v7
        with:
          name: casmsocial-python-sbom
          path: build/sbom/casmsocial-python.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Run MVP proof suite
        run: make mvp-all

      - name: List MVP output artifact paths
        id: mvp-artifacts
        run: |
          {
            echo 'paths<<EOF'
            make mvp-artifacts
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload MVP output
        uses: actions/upload-artifact@v7
        with:
          name: mvp-output
          path: ${{ steps.mvp-artifacts.outputs.paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Download MVP output artifact
        uses: actions/download-artifact@v7
        with:
          name: mvp-output
          path: downloaded-mvp-output

      - name: Verify downloaded MVP output artifact
        run: uv run python scripts/verify_mvp_manifest.py --manifest downloaded-mvp-output/mvp_manifest.json --artifact-root downloaded-mvp-output

  docker-build:
    name: Docker build (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build prod image
        run: docker build --target prod -t casmsocial:ci .

      - name: Smoke test -- models register, venv is on PATH
        run: |
          docker run --rm casmsocial:ci python -c "import casmsocial.casmpop; from casmsocial.factory import Models; models = Models.get_models(); assert 'casmsocial.casmpop.CasmPop' in models, models; print('OK:', sorted(models))"

      - name: Verify prod image excludes build-only tooling
        run: |
          docker run --rm casmsocial:ci sh -eu -c '
            test ! -e /bin/uv
            ! command -v uv
            ! command -v pip
            ! command -v cc
            ! command -v gcc
            ! command -v g++
            for package in build-essential libmpich-dev libomp-dev libgdal-dev libhdf5-dev libnetcdf-dev; do
              if dpkg-query -s "$package" 2>/dev/null | grep -q "^Status: install ok installed$"; then
                echo "Unexpected build-only package in prod image: $package" >&2
                exit 1
              fi
            done
            test ! -d /root/.cache/uv
            if find /app/.venv -type f -path "*/site-packages/setuptools/*.exe" | grep -q .; then
              echo "Unexpected Windows setuptools launcher in Linux prod image" >&2
              exit 1
            fi
          '

      - name: Smoke test -- native runtime dependencies
        run: |
          docker run --rm casmsocial:ci mpirun -n 1 python -c "from mpi4py import MPI; import rasterio, repast4py, torch; assert MPI.COMM_WORLD.Get_size() == 1; print('OK: MPI and compiled runtime dependencies')"

      - name: Scan prod image project payload for generated datasets
        run: docker run --rm casmsocial:ci python scripts/verify_release_artifacts.py /app

      - name: Create container SBOM output directory
        run: mkdir -p build/sbom

      - name: Generate production image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: casmsocial:ci
          format: spdx-json
          output-file: build/sbom/casmsocial-container.spdx.json
          artifact-name: casmsocial-container-sbom
          syft-version: v1.44.0
          upload-artifact-retention: 14

      - name: Verify production image dependency license policy
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/build/sbom",target=/sbom,readonly \
            casmsocial:ci \
            python scripts/verify_container_sbom.py \
              /sbom/casmsocial-container.spdx.json \
              --policy casmsocial/datasets/colorado_front_range/assets/container_dependency_license_policy.yaml \
              --evidence-root / \
              --expect-status review_required

      - name: Build tools image (partitioning extra)
        # pymetis has prebuilt wheels on manylinux x86_64 (this runner's
        # platform), so this validates the `tools` stage even though it
        # currently can't be built on arm64 -- pymetis must compile METIS
        # from source there and a meson/mpicxx interaction breaks (known,
        # documented limitation; see Dockerfile's `tools` stage comment).
        run: docker build --target tools -t casmsocial:ci-tools .

      - name: Smoke test -- pymetis importable in tools image
        run: docker run --rm casmsocial:ci-tools python -c "import pymetis; print('OK')"
