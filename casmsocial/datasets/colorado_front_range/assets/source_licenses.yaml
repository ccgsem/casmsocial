release_gates:
  - id: migrated_code_provenance
    status: documented_review_required
    requirement: Record origin and retained MIT notices for every migrated private-repository module.
    control: A per-source-file manifest records immutable commits, SHA-256 hashes, authorship, destination coverage, MIT evidence, and the retained notice; public CI verifies coverage and a local audit can re-read the private Git objects.
  - id: dependency_license_inventory
    status: automated_review_required
    requirement: Generate and review the Python and container dependency license/SBOM inventory.
    control: CI validates CycloneDX Python and SPDX production-image inventories against version-pinned policies and hashed in-image evidence; the container policy remains review_required pending accountable native-license and distribution review.
  - id: osm_distribution_policy
    status: implemented
    requirement: Decide whether releases distribute no OSM-derived data, a Produced Work, or an ODbL derived database, and implement the corresponding notices and source offer.
    control: The selected local-build-only policy excludes derived data from release artifacts and writes a hashed OpenStreetMap attribution and non-redistribution notice into each destination product.
  - id: release_artifact_scan
    status: automated
    requirement: Verify wheels, source distributions, containers, and documentation contain no generated identifier-bearing dataset files.
    control: scripts/verify_release_artifacts.py runs against Python distributions, the documentation site, and the production image in CI.
  - id: final_distribution_review
    status: organization_review_required
    requirement: Approve the final public distribution plan and record the accountable reviewers and evidence.
    control: The release-readiness policy and attestation contract prevent machine controls from being represented as organizational approval.
