# 2026-09-07 maintainer assessment: this routine dependency refresh remains
# in scope under PRS 26-1280's Ongoing Community/Consortium Participation
# pathway. The refreshed package licenses are compatible with CASMSocial's
# MIT distribution. Torch 2.14's SBOM declares a composite expression; its
# BSL-1.0 identifier is Boost Software License 1.0, and the wheel retains
# the associated third-party license notices.
maintenance_assessments:
  - date: 2026-09-07
    scope: dependency_refresh
    packages:
      - numba==0.67.0
      - pandas==3.0.5
      - protobuf==7.36.1
      - scipy==1.18.1
      - torch==2.14.0+cpu
    decision: compatible_with_mit_distribution
    evidence: PyTorch v2.14.0 LICENSE and wheel license files; SPDX BSL-1.0 (Boost Software License 1.0).
