scanner_subject:
  package_type: oci
  spdx_id_prefix: SPDXRef-DocumentRoot-
  required_count: 1
  rationale: The OCI record identifies the image being scanned; it is not an additional distributed dependency.
native_review:
  package_type: deb
  require_license_metadata: true
  status: review_required
  review_trigger_patterns:
    - '(^|[^L])GPL-[0-9]'
    - 'LGPL-[0-9]'
    - 'AGPL-[0-9]'
    - 'LicenseRef-'
  rationale: Debian copyright expressions can aggregate licenses for many source files; accountable review is required before drawing binary-distribution conclusions.
