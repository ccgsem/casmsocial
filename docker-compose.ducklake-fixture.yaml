services:
  # Postgres holds the DuckLake catalog. The default image is the Docker
  # Hardened Image (`docker login dhi.io`), which runs as uid 70 and keeps its
  # cluster in /var/lib/postgresql/16/data. PGDATA is set explicitly so the
  # official postgres:16 image also works as an override. The volume name
  # changed with the image: volumes made by the official image hold a cluster
  # owned by uid 999, which the hardened image can't open.
  ducklake-postgres:
    image: ${CASMSOCIAL_DUCKLAKE_POSTGRES_IMAGE:-dhi.io/postgres:16@sha256:c7b1356f8b362c31077d5775b42a43e56c62f27aabd68e957e1ef5ce15813a9f}
    environment:
      PGDATA: /var/lib/postgresql/16/data
      POSTGRES_DB: ${CASMSOCIAL_DUCKLAKE_POSTGRES_DB:-casmsocial_ducklake}
      POSTGRES_USER: ${CASMSOCIAL_DUCKLAKE_POSTGRES_USER:-casmsocial}
      POSTGRES_PASSWORD: ${CASMSOCIAL_DUCKLAKE_POSTGRES_PASSWORD:-casmsocial}
    ports:
      - "${CASMSOCIAL_DUCKLAKE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ducklake-postgres16-data:/var/lib/postgresql/16/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage: SeaweedFS (master, volume, filer and S3 gateway in
  # one `weed server` process), using the same pattern as casmdb/deploy. It
  # replaced MinIO, whose community edition is archived and whose images some
  # Docker Hub organizations block. The default image is the Docker Hardened
  # Image (`docker login dhi.io` first); it has no shell, so the busybox
  # prepare job writes the S3 identity file and supplies sh/wget in /tools.
  ducklake-s3-prepare:
    image: ${CASMSOCIAL_DUCKLAKE_BUSYBOX_IMAGE:-busybox:1.37.0-musl}
    restart: "no"
    entrypoint: ["/bin/sh", "/prepare.sh"]
    volumes:
      - ./docker/ducklake-fixture/seaweedfs/prepare.sh:/prepare.sh:ro
      - ducklake-s3-config:/config
      - ducklake-s3-tools:/tools
      - ducklake-s3-data:/data
    environment:
      S3_ACCESS_KEY_ID: ${CASMSOCIAL_DUCKLAKE_S3_ACCESS_KEY_ID:-casmsocial}
      S3_SECRET_ACCESS_KEY: ${CASMSOCIAL_DUCKLAKE_S3_SECRET_ACCESS_KEY:-casmsocial-secret}

  ducklake-s3:
    image: ${CASMSOCIAL_DUCKLAKE_SEAWEEDFS_IMAGE:-dhi.io/seaweedfs:4.48@sha256:cb6ec04e76bb110daa4837cf109e8a2a9c30de4238d47ac5bb8a1e646f880822}
    depends_on:
      ducklake-s3-prepare:
        condition: service_completed_successfully
    # The image's entrypoint is `weed`. The filer keeps its metadata store
    # relative to the working directory.
    working_dir: /data/store
    environment:
      # The image's own filer.toml puts the filer store at /data/filerldb2, on
      # the volume's top level; keep it in /data/store with the rest.
      WEED_LEVELDB2_DIR: /data/store/filerldb2
    command:
      - server
      - -dir=/data/store
      - -volume.max=0
      # SeaweedFS grows a collection seven volumes at a time and refuses
      # writes unless the disk has room for them, so 1 GB volumes need about
      # 8 GB free. The fixture holds ~20 MB; 64 MB volumes need under 0.5 GB.
      - -master.volumeSizeLimitMB=${CASMSOCIAL_DUCKLAKE_SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-64}
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.config=/config/s3.json
    # weed server shuts its filer, volume and master down in turn; the default
    # 10s ends in SIGKILL.
    stop_grace_period: 30s
    ports:
      - "${CASMSOCIAL_DUCKLAKE_S3_API_PORT:-${CASMSOCIAL_DUCKLAKE_MINIO_API_PORT:-59000}}:9000"
    volumes:
      # nocopy keeps the image's own /data contents out of the volume. Data
      # lives in /data/store, which the prepare job owns for uid 65532.
      - type: volume
        source: ducklake-s3-data
        target: /data
        volume:
          nocopy: true
      - ducklake-s3-config:/config:ro
      - ducklake-s3-tools:/tools:ro
    healthcheck:
      test: ["CMD", "/tools/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  ducklake-s3-init:
    image: ${CASMSOCIAL_DUCKLAKE_SEAWEEDFS_IMAGE:-dhi.io/seaweedfs:4.48@sha256:cb6ec04e76bb110daa4837cf109e8a2a9c30de4238d47ac5bb8a1e646f880822}
    depends_on:
      ducklake-s3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/tools/sh", "/init-bucket.sh"]
    volumes:
      - ./docker/ducklake-fixture/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
      - ducklake-s3-tools:/tools:ro
    environment:
      S3_BUCKET: ${CASMSOCIAL_DUCKLAKE_S3_BUCKET:-casmsocial-ducklake}
      SEAWEEDFS_MASTER: ducklake-s3:9333

  ducklake-fixture-loader:
    image: casmsocial-ducklake-fixture:local
    build:
      context: .
      target: prod
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST:-}
    depends_on:
      ducklake-postgres:
        condition: service_healthy
      ducklake-s3-init:
        condition: service_completed_successfully
    working_dir: /app
    # The image excludes testdata/ (.dockerignore), so mount the fixture.
    volumes:
      - ./testdata/wake_county_heat_1000_households:/app/testdata/wake_county_heat_1000_households:ro
    environment:
      CASMSOCIAL_DUCKLAKE_POSTGRES_CONNECTION: host=ducklake-postgres port=5432 dbname=${CASMSOCIAL_DUCKLAKE_POSTGRES_DB:-casmsocial_ducklake} user=${CASMSOCIAL_DUCKLAKE_POSTGRES_USER:-casmsocial} password=${CASMSOCIAL_DUCKLAKE_POSTGRES_PASSWORD:-casmsocial}
      CASMSOCIAL_DUCKLAKE_S3_DATA_PATH: s3://${CASMSOCIAL_DUCKLAKE_S3_BUCKET:-casmsocial-ducklake}/wake_county_heat
      CASMSOCIAL_DUCKLAKE_S3_ENDPOINT: ducklake-s3:9000
      CASMSOCIAL_DUCKLAKE_S3_URL_STYLE: path
      CASMSOCIAL_DUCKLAKE_S3_USE_SSL: "false"
      AWS_ACCESS_KEY_ID: ${CASMSOCIAL_DUCKLAKE_S3_ACCESS_KEY_ID:-casmsocial}
      AWS_SECRET_ACCESS_KEY: ${CASMSOCIAL_DUCKLAKE_S3_SECRET_ACCESS_KEY:-casmsocial-secret}
      AWS_REGION: ${CASMSOCIAL_DUCKLAKE_S3_REGION:-us-east-1}
    command:
      [
        "python",
        "scripts/materialize_wake_county_heat_fixture.py",
        "--target",
        "postgres-s3",
        "--fixture-path",
        "testdata/wake_county_heat_1000_households",
      ]

volumes:
  ducklake-postgres16-data:
  ducklake-s3-data:
  ducklake-s3-config:
  ducklake-s3-tools:
