services:
  ducklake-postgres:
    image: ${CASMSOCIAL_DUCKLAKE_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${CASMSOCIAL_DUCKLAKE_POSTGRES_DB:-casmsocial_ducklake}
      POSTGRES_USER: ${CASMSOCIAL_DUCKLAKE_POSTGRES_USER:-casmsocial}
      POSTGRES_PASSWORD: ${CASMSOCIAL_DUCKLAKE_POSTGRES_PASSWORD:-casmsocial}
    ports:
      - "${CASMSOCIAL_DUCKLAKE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ducklake-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage: SeaweedFS (master, volume, filer and S3 gateway in
  # one `weed server` process). It replaced MinIO, whose community edition is
  # archived and whose images some Docker Hub organizations block. Where
  # chrislusf/seaweedfs is blocked too, build casmdb's pinned-source image
  # (casmdb/deploy: `docker compose build seaweedfs`) and set
  # CASMSOCIAL_DUCKLAKE_SEAWEEDFS_IMAGE=casm-seaweedfs:4.48.
  ducklake-s3:
    image: ${CASMSOCIAL_DUCKLAKE_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48}
    # The filer keeps its metadata store relative to the working directory.
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}\n' "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${CASMSOCIAL_DUCKLAKE_S3_ACCESS_KEY_ID:-casmsocial}
      S3_SECRET_ACCESS_KEY: ${CASMSOCIAL_DUCKLAKE_S3_SECRET_ACCESS_KEY:-casmsocial-secret}
    ports:
      - "${CASMSOCIAL_DUCKLAKE_S3_API_PORT:-${CASMSOCIAL_DUCKLAKE_MINIO_API_PORT:-59000}}:9000"
    volumes:
      - ducklake-s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  ducklake-s3-init:
    image: ${CASMSOCIAL_DUCKLAKE_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.48}
    depends_on:
      ducklake-s3:
        condition: service_healthy
    environment:
      CASMSOCIAL_DUCKLAKE_S3_BUCKET: ${CASMSOCIAL_DUCKLAKE_S3_BUCKET:-casmsocial-ducklake}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        bucket="$${CASMSOCIAL_DUCKLAKE_S3_BUCKET}"
        if echo "s3.bucket.list" | weed shell -master=ducklake-s3:9333 2>/dev/null | grep -Eq "^[[:space:]]*$${bucket}([[:space:]]|$$)"; then
          echo "Bucket $${bucket} already exists."
        else
          echo "s3.bucket.create -name $${bucket}" | weed shell -master=ducklake-s3:9333
          echo "Bucket $${bucket} created."
        fi

  ducklake-fixture-loader:
    image: casmsocial-ducklake-fixture:local
    build:
      context: .
      target: prod
      args:
        UV_INSECURE_HOST: ${UV_INSECURE_HOST:-}
    depends_on:
      ducklake-postgres:
        condition: service_healthy
      ducklake-s3-init:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      CASMSOCIAL_DUCKLAKE_POSTGRES_CONNECTION: host=ducklake-postgres port=5432 dbname=${CASMSOCIAL_DUCKLAKE_POSTGRES_DB:-casmsocial_ducklake} user=${CASMSOCIAL_DUCKLAKE_POSTGRES_USER:-casmsocial} password=${CASMSOCIAL_DUCKLAKE_POSTGRES_PASSWORD:-casmsocial}
      CASMSOCIAL_DUCKLAKE_S3_DATA_PATH: s3://${CASMSOCIAL_DUCKLAKE_S3_BUCKET:-casmsocial-ducklake}/wake_county_heat
      CASMSOCIAL_DUCKLAKE_S3_ENDPOINT: ducklake-s3:9000
      CASMSOCIAL_DUCKLAKE_S3_URL_STYLE: path
      CASMSOCIAL_DUCKLAKE_S3_USE_SSL: "false"
      AWS_ACCESS_KEY_ID: ${CASMSOCIAL_DUCKLAKE_S3_ACCESS_KEY_ID:-casmsocial}
      AWS_SECRET_ACCESS_KEY: ${CASMSOCIAL_DUCKLAKE_S3_SECRET_ACCESS_KEY:-casmsocial-secret}
      AWS_REGION: ${CASMSOCIAL_DUCKLAKE_S3_REGION:-us-east-1}
    command:
      [
        "python",
        "scripts/materialize_wake_county_heat_fixture.py",
        "--target",
        "postgres-s3",
        "--fixture-path",
        "testdata/wake_county_heat_1000_households",
      ]

volumes:
  ducklake-postgres-data:
  ducklake-s3-data:
